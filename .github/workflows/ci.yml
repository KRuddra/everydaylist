name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    # Dummy values so modules that validate env at import (lib/config/env.ts)
    # don't fail the lint/typecheck/test steps. No real secrets in CI.
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db?sslmode=disable"
      AUTH_SECRET: "ci-placeholder-secret-value-at-least-32-chars"
      APP_PASSWORD_HASH: "$2a$12$ci.placeholder.hash.value.for.ci.checks.only.0000000000"
      APP_TIMEZONE: "America/Toronto"
      NEXT_PUBLIC_APP_TIMEZONE: "America/Toronto"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test
